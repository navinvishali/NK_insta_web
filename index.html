<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>NK Instagram</title>

  <!-- Instagram official embed script -->
  <script async src="https://www.instagram.com/embed.js"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: #f5f5f7;
      color: #222;
    }

    /* Header */
    header {
      background: linear-gradient(135deg, #833ab4, #fd1d1d, #fcb045);
      color: white;
      padding: 32px 20px;
      text-align: center;
    }

    header h1 {
      margin: 0;
      font-size: 32px;
      font-weight: 800;
    }

    header p {
      margin: 8px 0 0;
      font-size: 15px;
      opacity: 0.95;
    }

    /* Main */
    main {
      max-width: 1100px;
      margin: 0 auto;
      padding: 25px 15px 50px;
    }

    /* Controls */
    .controls {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
      margin-bottom: 25px;
    }

    .filter-btn,
    .refresh-btn {
      border: none;
      padding: 10px 18px;
      border-radius: 25px;
      cursor: pointer;
      font-size: 14px;
      font-weight: 600;
      background: white;
      color: #444;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
      transition: 0.2s;
    }

    .filter-btn:hover,
    .refresh-btn:hover {
      transform: translateY(-1px);
    }

    .filter-btn.active {
      background: #111;
      color: white;
    }

    .refresh-btn {
      background: #833ab4;
      color: white;
    }

    /* Date filters */
    .date-filter {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
      justify-content: center;
    }

    .date-filter label {
      font-size: 13px;
      font-weight: 600;
      color: #555;
    }

    .date-filter input {
      border: 1px solid #ddd;
      background: white;
      padding: 9px 11px;
      border-radius: 10px;
      font-size: 13px;
      color: #333;
      box-shadow: 0 2px 8px rgba(0,0,0,0.05);
      cursor: pointer;
    }

    .date-action-btn {
      border: none;
      padding: 10px 15px;
      border-radius: 20px;
      cursor: pointer;
      font-size: 13px;
      font-weight: 700;
      background: #111;
      color: white;
      transition: 0.2s;
    }

    .date-action-btn:hover {
      transform: translateY(-1px);
      opacity: 0.9;
    }

    .date-clear-btn {
      background: #e9e9e9;
      color: #333;
    }

    /* Status */
    #status {
      text-align: center;
      margin: 15px 0 25px;
      color: #666;
      font-size: 14px;
    }

    /* Posts - equal-size cards */
    #posts {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      align-items: stretch;
      gap: 18px;
      width: 100%;
    }

    .post-card {
      width: 100%;
      min-width: 0;
      height: 430px;
      background: white;
      border-radius: 12px;
      padding: 10px;
      box-shadow: 0 3px 12px rgba(0,0,0,0.08);
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    /* Top information area */
    .post-meta {
      display: flex;
      flex-direction: column;
      align-items: stretch;
      gap: 6px;
      margin-bottom: 8px;
      padding: 0 2px;
    }

    .post-top-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 6px;
    }

    /* Date shown at top */
    .post-timestamp {
      font-size: 11px;
      color: #777;
      font-weight: 600;
      text-align: left;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .category {
      background: #f0e6ff;
      color: #6a1b9a;
      padding: 5px 12px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 700;
    }

    .media {
      background: #f1f1f1;
      color: #555;
      padding: 5px 12px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 600;
    }

    /* Instagram */
    .instagram-container {
      width: 100%;
      flex: 1;
      overflow: hidden;
    }

    .instagram-container .instagram-media {
      max-width: 100% !important;
      min-width: 0 !important;
      width: auto !important;
      margin: 0 !important;
    }

    /* Empty / error */
    .message {
      text-align: center;
      padding: 40px 20px;
      color: #666;
      font-size: 15px;
    }

    /* Footer */
    footer {
      text-align: center;
      padding: 25px;
      color: #888;
      font-size: 13px;
    }

    /* Mobile */
    @media (max-width: 600px) {

      header {
        padding: 25px 15px;
      }

      header h1 {
        font-size: 26px;
      }

      main {
        padding: 20px 10px 40px;
      }

      #posts {
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 10px;
      }

      .post-card {
        width: 100%;
        height: 390px;
        padding: 7px;
        border-radius: 10px;
      }

      .category,
      .media {
        padding: 4px 7px;
        font-size: 10px;
      }

      .post-timestamp {
        font-size: 9px;
      }

      .date-filter {
        width: 100%;
        gap: 6px;
      }

      .date-filter label {
        font-size: 11px;
      }

      .date-filter input {
        font-size: 11px;
        padding: 8px;
      }

      .date-action-btn {
        font-size: 11px;
        padding: 8px 12px;
      }

    }
  </style>
</head>

<body>

  <!-- Header -->
  <header>
    <h1>📸 NK Instagram</h1>
    <p>My Instagram collection</p>
  </header>

  <main>

    <!-- Category and Date filters -->
    <div class="controls">

      <div id="filters"></div>

      <div class="date-filter">
        <label for="fromDate">From:</label>
        <input type="date" id="fromDate">

        <label for="toDate">To:</label>
        <input type="date" id="toDate">

        <button
          class="date-action-btn"
          onclick="applyDateFilter()"
        >
          🔎 Apply
        </button>

        <button
          class="date-action-btn date-clear-btn"
          onclick="clearDateFilter()"
        >
          ✕ Clear
        </button>
      </div>

      <button class="refresh-btn" onclick="loadPosts()">
        🔄 Refresh
      </button>

    </div>

    <!-- Status -->
    <div id="status">
      Loading Instagram posts...
    </div>

    <!-- Posts -->
    <section id="posts"></section>

  </main>

  <footer>
    Instagram posts are embedded directly from Instagram.
  </footer>


  <script>

    /*
      =====================================================
      CLOUDFLARE WORKER
      =====================================================
    */

    const WORKER_URL =
      "https://nk-insta.navinvishali2025.workers.dev/";


    /*
      =====================================================
      GLOBAL DATA
      =====================================================
    */

    let allPosts = [];
    let activeCategory = "All";
    let activeFromDate = "";
    let activeToDate = "";


    /*
      =====================================================
      LOAD POSTS FROM GOOGLE SHEET THROUGH WORKER
      =====================================================
    */

    async function loadPosts() {

      const status =
        document.getElementById("status");

      const postsContainer =
        document.getElementById("posts");

      status.textContent =
        "Loading Instagram posts...";

      postsContainer.innerHTML = "";

      try {

        const response =
          await fetch(WORKER_URL);

        if (!response.ok) {
          throw new Error(
            "Worker request failed"
          );
        }

        const data =
          await response.json();

        if (!data.success) {
          throw new Error(
            data.error ||
            "Unable to load posts"
          );
        }

        allPosts =
          data.posts || [];

        createFilters();

        displayPosts();

      } catch (error) {

        console.error(error);

        status.textContent =
          "Unable to load Instagram posts.";

        postsContainer.innerHTML = `
          <div class="message">
            ❌ Unable to load posts.<br><br>
            Please check the Cloudflare Worker
            and Google Sheet.
          </div>
        `;
      }
    }


    /*
      =====================================================
      CREATE CATEGORY FILTERS
      =====================================================
    */

    function createFilters() {

      const filtersContainer =
        document.getElementById("filters");

      filtersContainer.innerHTML = "";

      const categories = [
        "All",

        ...new Set(
          allPosts
            .map(
              post => post.category
            )
            .filter(
              category => category
            )
        )
      ];

      categories.forEach(
        category => {

          const button =
            document.createElement(
              "button"
            );

          button.className =
            "filter-btn";

          if (
            category ===
            activeCategory
          ) {

            button.classList.add(
              "active"
            );
          }

          button.textContent =
            category;

          button.onclick =
            function () {

              activeCategory =
                category;

              createFilters();

              displayPosts();
            };

          filtersContainer
            .appendChild(button);
        }
      );
    }


    /*
      =====================================================
      NORMALIZE INSTAGRAM URL
      =====================================================
    */

    function normalizeInstagramUrl(url) {

      if (!url) {
        return null;
      }

      try {

        const parsed =
          new URL(
            url.trim()
          );

        if (
          parsed.hostname !==
            "www.instagram.com" &&
          parsed.hostname !==
            "instagram.com"
        ) {

          return null;
        }

        const parts =
          parsed.pathname
            .split("/")
            .filter(Boolean);

        if (
          parts.length < 2
        ) {

          return null;
        }

        const type =
          parts[0];

        const id =
          parts[1];

        if (
          type !== "p" &&
          type !== "reel" &&
          type !== "tv"
        ) {

          return null;
        }

        return `
          https://www.instagram.com/
          ${type}/${id}/
        `.replace(/\s+/g, "");

      } catch {

        return null;
      }
    }


    /*
      =====================================================
      GET DATE ENTERED IN GOOGLE SHEET
      =====================================================
    */

    function formatPostTimestamp(post) {

      // Display ONLY the Google Sheet Date column.
      if (
        post.Date === null ||
        post.Date === undefined ||
        String(post.Date).trim() === ""
      ) {
        return "Date unavailable";
      }

      return String(post.Date).trim();
    }

    /*
      =====================================================
      DATE FILTER HELPERS
      =====================================================
    */

    function parsePostDate(post) {

      /*
        IMPORTANT:
        ONLY the Google Sheet "Date" column is used.
        No Instagram date or other timestamp field is used.
      */

      if (
        post.Date === null ||
        post.Date === undefined ||
        String(post.Date).trim() === ""
      ) {
        return null;
      }

      const value = String(post.Date).trim();

      // YYYY-MM-DD / YYYY/MM/DD
      let match = value.match(
        /^(\d{4})[-\/](\d{1,2})[-\/](\d{1,2})/
      );

      if (match) {
        return makeValidDate(
          Number(match[1]),
          Number(match[2]),
          Number(match[3])
        );
      }

      // DD/MM/YYYY or DD-MM-YYYY
      match = value.match(
        /^(\d{1,2})[-\/](\d{1,2})[-\/](\d{2,4})/
      );

      if (match) {
        let year = Number(match[3]);

        if (year < 100) {
          year += 2000;
        }

        return makeValidDate(
          year,
          Number(match[2]),
          Number(match[1])
        );
      }

      // DD Mon YYYY / DD Month YYYY
      match = value.match(
        /^(\d{1,2})\s+([A-Za-z]+)\s+(\d{2,4})/
      );

      if (match) {
        let year = Number(match[3]);

        if (year < 100) {
          year += 2000;
        }

        const monthNames = [
          "jan", "feb", "mar", "apr", "may", "jun",
          "jul", "aug", "sep", "oct", "nov", "dec"
        ];

        const monthText = match[2].toLowerCase();
        const monthIndex = monthNames.findIndex(
          month => monthText.startsWith(month)
        );

        if (monthIndex !== -1) {
          return makeValidDate(
            year,
            monthIndex + 1,
            Number(match[1])
          );
        }
      }

      // Google Sheets may sometimes return a full date/time string.
      // Still use ONLY post.Date.
      const fallback = new Date(value);

      if (!isNaN(fallback.getTime())) {
        return new Date(
          fallback.getFullYear(),
          fallback.getMonth(),
          fallback.getDate()
        );
      }

      return null;
    }


    function makeValidDate(year, month, day) {

      const date = new Date(
        year,
        month - 1,
        day
      );

      // Prevent JavaScript from accepting invalid dates
      // such as 31/02/2026.
      if (
        date.getFullYear() !== year ||
        date.getMonth() !== month - 1 ||
        date.getDate() !== day
      ) {
        return null;
      }

      return date;
    }


    function dateOnly(date) {

      return new Date(
        date.getFullYear(),
        date.getMonth(),
        date.getDate()
      );
    }


    function applyDateFilter() {

      const fromInput =
        document.getElementById("fromDate").value;

      const toInput =
        document.getElementById("toDate").value;

      if (
        fromInput &&
        toInput &&
        fromInput > toInput
      ) {
        alert("From date cannot be later than To date.");
        return;
      }

      activeFromDate = fromInput;
      activeToDate = toInput;

      displayPosts();
    }


    function clearDateFilter() {

      document.getElementById("fromDate").value = "";
      document.getElementById("toDate").value = "";

      activeFromDate = "";
      activeToDate = "";

      displayPosts();
    }


    function matchesDateFilter(post) {

      if (!activeFromDate && !activeToDate) {
        return true;
      }

      const postDate = parsePostDate(post);

      // If the Sheet Date is missing/invalid, it cannot
      // match an active date filter.
      if (!postDate) {
        return false;
      }

      // Convert the Sheet date to the exact same format
      // used by the HTML date inputs: YYYY-MM-DD.
      const postDateString =
        postDate.getFullYear() +
        "-" +
        String(postDate.getMonth() + 1).padStart(2, "0") +
        "-" +
        String(postDate.getDate()).padStart(2, "0");

      if (
        activeFromDate &&
        postDateString < activeFromDate
      ) {
        return false;
      }

      if (
        activeToDate &&
        postDateString > activeToDate
      ) {
        return false;
      }

      return true;
    }

    /*
      =====================================================
      DISPLAY POSTS
      =====================================================
    */

    function displayPosts() {

      const postsContainer =
        document.getElementById(
          "posts"
        );

      const status =
        document.getElementById(
          "status"
        );

      postsContainer.innerHTML =
        "";


      let filteredPosts;


      filteredPosts = allPosts.filter(
        post => {

          const categoryMatches =
            activeCategory === "All" ||
            post.category === activeCategory;

          const dateMatches =
            matchesDateFilter(post);

          return categoryMatches && dateMatches;
        }
      );


      /*
        No posts
      */

      if (
        filteredPosts.length ===
        0
      ) {

        status.textContent =
          "";

        postsContainer.innerHTML = `
          <div class="message">
            No Instagram posts found.
          </div>
        `;

        return;
      }


      /*
        Number of posts
      */

      let filterDescription = "";

      if (activeFromDate || activeToDate) {

        const fromText =
          activeFromDate
            ? new Date(
                activeFromDate + "T00:00:00"
              ).toLocaleDateString(
                "en-IN",
                {
                  day: "2-digit",
                  month: "short",
                  year: "numeric"
                }
              )
            : "Beginning";

        const toText =
          activeToDate
            ? new Date(
                activeToDate + "T00:00:00"
              ).toLocaleDateString(
                "en-IN",
                {
                  day: "2-digit",
                  month: "short",
                  year: "numeric"
                }
              )
            : "Today";

        filterDescription =
          ` | ${fromText} → ${toText}`;
      }

      status.textContent =
        `${
          filteredPosts.length
        } Instagram post${
          filteredPosts.length ===
          1
            ? ""
            : "s"
        }${filterDescription}`;


      /*
        Create cards
      */

      filteredPosts.forEach(
        post => {

          const instagramUrl =
            normalizeInstagramUrl(
              post.url
            );


          if (!instagramUrl) {
            return;
          }


          const card =
            document.createElement(
              "article"
            );

          card.className =
            "post-card";


          card.innerHTML = `

            <div class="post-meta">

              <!-- Date entered in Sheet -->
              <div class="post-timestamp">
                🕒 Posted:
                ${escapeHtml(
                  formatPostTimestamp(
                    post
                  )
                )}
              </div>


              <div class="post-top-row">

                <span class="category">
                  ${escapeHtml(
                    post.category ||
                    "Other"
                  )}
                </span>

                <span class="media">
                  ${escapeHtml(
                    post.media ||
                    "Photo"
                  )}
                </span>

              </div>

            </div>


            <div class="instagram-container">

              <blockquote
                class="instagram-media"
                data-instgrm-permalink="${instagramUrl}"
                data-instgrm-version="14"
                style="
                  background:#FFF;
                  border:0;
                  border-radius:3px;
                  box-shadow:
                    0 0 1px 0
                    rgba(0,0,0,0.5),
                    0 1px 10px 0
                    rgba(0,0,0,0.15);
                  margin:1px;
                  max-width:540px;
                  min-width:326px;
                  padding:0;
                  width:calc(100% - 2px);
                "
              >

                <div
                  style="
                    padding:16px;
                  "
                >

                  <a
                    href="${instagramUrl}"
                    target="_blank"
                    rel="noopener noreferrer"
                    style="
                      text-decoration:none;
                      color:#333;
                    "
                  >

                    View this post
                    on Instagram

                  </a>

                </div>

              </blockquote>

            </div>
          `;


          postsContainer
            .appendChild(card);

        }
      );


      /*
        Process Instagram embeds
      */

      processInstagramEmbeds();
    }


    /*
      =====================================================
      PROCESS INSTAGRAM EMBEDS
      =====================================================
    */

    function processInstagramEmbeds() {

      if (

        window.instgrm &&

        window.instgrm.Embeds

      ) {

        window.instgrm
          .Embeds
          .process();

      } else {

        setTimeout(
          processInstagramEmbeds,
          500
        );
      }
    }


    /*
      =====================================================
      HTML ESCAPE
      =====================================================
    */

    function escapeHtml(value) {

      return String(value)

        .replace(
          /&/g,
          "&amp;"
        )

        .replace(
          /</g,
          "&lt;"
        )

        .replace(
          />/g,
          "&gt;"
        )

        .replace(
          /"/g,
          "&quot;"
        )

        .replace(
          /'/g,
          "&#039;"
        );
    }


    /*
      =====================================================
      START WEBSITE
      =====================================================
    */


    // Keep the From/To date controls consistent.
    document.getElementById("fromDate").addEventListener(
      "change",
      function () {
        const toDate =
          document.getElementById("toDate");

        if (this.value) {
          toDate.min = this.value;
        } else {
          toDate.removeAttribute("min");
        }
      }
    );

    document.getElementById("toDate").addEventListener(
      "change",
      function () {
        const fromDate =
          document.getElementById("fromDate");

        if (this.value) {
          fromDate.max = this.value;
        } else {
          fromDate.removeAttribute("max");
        }
      }
    );

    loadPosts();

  </script>

</body>
</html>
