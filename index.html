<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>NK Instagram</title>

  <script async src="https://www.instagram.com/embed.js"></script>

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: #f5f5f7;
      color: #222;
    }

    header {
      background: linear-gradient(
        135deg,
        #833ab4,
        #fd1d1d,
        #fcb045
      );
      color: white;
      padding: 32px 20px;
      text-align: center;
    }

    header h1 {
      margin: 0;
      font-size: 32px;
      font-weight: 800;
    }

    header p {
      margin: 8px 0 0;
      font-size: 15px;
      opacity: 0.95;
    }

    main {
      max-width: 1100px;
      margin: 0 auto;
      padding: 25px 15px 50px;
    }

    .controls {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
      margin-bottom: 25px;
    }

    .filter-btn,
    .refresh-btn {
      border: none;
      padding: 10px 18px;
      border-radius: 25px;
      cursor: pointer;
      font-size: 14px;
      font-weight: 600;
      background: white;
      color: #444;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
      transition: 0.2s;
    }

    .filter-btn:hover,
    .refresh-btn:hover {
      transform: translateY(-1px);
    }

    .filter-btn.active {
      background: #111;
      color: white;
    }

    .refresh-btn {
      background: #833ab4;
      color: white;
    }

    .date-filter {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
      justify-content: center;
    }

    .date-filter label {
      font-size: 13px;
      font-weight: 600;
      color: #555;
    }

    .date-filter input {
      border: 1px solid #ddd;
      background: white;
      padding: 9px 11px;
      border-radius: 10px;
      font-size: 13px;
      color: #333;
      box-shadow: 0 2px 8px rgba(0,0,0,0.05);
      cursor: pointer;
    }

    .date-action-btn {
      border: none;
      padding: 10px 15px;
      border-radius: 20px;
      cursor: pointer;
      font-size: 13px;
      font-weight: 700;
      background: #111;
      color: white;
      transition: 0.2s;
    }

    .date-action-btn:hover {
      transform: translateY(-1px);
      opacity: 0.9;
    }

    .date-clear-btn {
      background: #e9e9e9;
      color: #333;
    }

    #status {
      text-align: center;
      margin: 15px 0 25px;
      color: #666;
      font-size: 14px;
    }

    #posts {
      display: grid;
      grid-template-columns: repeat(
        auto-fill,
        minmax(280px, 1fr)
      );
      align-items: stretch;
      gap: 18px;
      width: 100%;
    }

    .post-card {
      width: 100%;
      min-width: 0;
      height: 430px;
      background: white;
      border-radius: 12px;
      padding: 10px;
      box-shadow: 0 3px 12px rgba(0,0,0,0.08);
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    .post-meta {
      display: flex;
      flex-direction: column;
      align-items: stretch;
      gap: 6px;
      margin-bottom: 8px;
      padding: 0 2px;
    }

    .post-top-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 6px;
    }

    .post-timestamp {
      font-size: 11px;
      color: #777;
      font-weight: 600;
      text-align: left;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .category {
      background: #f0e6ff;
      color: #6a1b9a;
      padding: 5px 12px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 700;
    }

    .media {
      background: #f1f1f1;
      color: #555;
      padding: 5px 12px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 600;
    }

    .instagram-container {
      width: 100%;
      flex: 1;
      overflow: hidden;
    }

    .instagram-container .instagram-media {
      max-width: 100% !important;
      min-width: 0 !important;
      width: auto !important;
      margin: 0 !important;
    }

    .message {
      text-align: center;
      padding: 40px 20px;
      color: #666;
      font-size: 15px;
    }

    footer {
      text-align: center;
      padding: 25px;
      color: #888;
      font-size: 13px;
    }

    @media (max-width: 600px) {

      header {
        padding: 25px 15px;
      }

      header h1 {
        font-size: 26px;
      }

      main {
        padding: 20px 10px 40px;
      }

      #posts {
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 10px;
      }

      .post-card {
        width: 100%;
        height: 390px;
        padding: 7px;
        border-radius: 10px;
      }

      .category,
      .media {
        padding: 4px 7px;
        font-size: 10px;
      }

      .post-timestamp {
        font-size: 9px;
      }

      .date-filter {
        width: 100%;
        gap: 6px;
      }

      .date-filter label {
        font-size: 11px;
      }

      .date-filter input {
        font-size: 11px;
        padding: 8px;
      }

      .date-action-btn {
        font-size: 11px;
        padding: 8px 12px;
      }
    }

  </style>

</head>


<body>


<header>

  <h1>📸 NK Instagram</h1>

  <p>My Instagram collection</p>

</header>


<main>


  <div class="controls">


    <div id="filters"></div>


    <div class="date-filter">

      <label for="fromDate">From:</label>

      <input
        type="date"
        id="fromDate"
      >


      <label for="toDate">To:</label>

      <input
        type="date"
        id="toDate"
      >


      <button
        class="date-action-btn"
        onclick="applyDateFilter()"
      >
        🔎 Apply
      </button>


      <button
        class="date-action-btn date-clear-btn"
        onclick="clearDateFilter()"
      >
        ✕ Clear
      </button>

    </div>


    <button
      class="refresh-btn"
      onclick="loadPosts()"
    >
      🔄 Refresh
    </button>

  </div>


  <div id="status">
    Loading Instagram posts...
  </div>


  <section id="posts"></section>


</main>


<footer>
  Instagram posts are embedded directly from Instagram.
</footer>



<script>


/*
=====================================================
CLOUDFLARE WORKER
=====================================================
*/

const WORKER_URL =
  "https://nk-insta.navinvishali2025.workers.dev/";



/*
=====================================================
GLOBAL DATA
=====================================================
*/

let allPosts = [];

let activeCategory = "All";

let activeFromDate = "";

let activeToDate = "";



/*
=====================================================
GET DATE ONLY FROM SHEET / CSV
=====================================================

IMPORTANT:

The website NEVER creates the post date.

It only reads the Date value supplied
by the Cloudflare Worker.

Expected field:

post.Date
=====================================================
*/

function getSheetDate(post) {

  if (
    post.Date !== undefined &&
    post.Date !== null
  ) {
    return String(post.Date).trim();
  }

  /*
    These are only fallback column-name
    checks in case the Worker changes
    capitalization.

    Still comes from the Sheet/CSV.
  */

  if (
    post.date !== undefined &&
    post.date !== null
  ) {
    return String(post.date).trim();
  }

  if (
    post.DATE !== undefined &&
    post.DATE !== null
  ) {
    return String(post.DATE).trim();
  }

  return "";
}



/*
=====================================================
LOAD POSTS
=====================================================
*/

async function loadPosts() {

  const status =
    document.getElementById("status");

  const postsContainer =
    document.getElementById("posts");


  status.textContent =
    "Loading Instagram posts...";


  postsContainer.innerHTML = "";


  try {

    const response =
      await fetch(WORKER_URL);


    if (!response.ok) {

      throw new Error(
        "Worker request failed"
      );

    }


    const data =
      await response.json();


    if (!data.success) {

      throw new Error(
        data.error ||
        "Unable to load posts"
      );

    }


    allPosts =
      data.posts || [];


    /*
      DEBUGGING:

      This shows exactly what the
      Cloudflare Worker is sending.
    */

    console.log(
      "Instagram posts received:",
      allPosts
    );


    if (allPosts.length > 0) {

      console.log(
        "First post:",
        allPosts[0]
      );

      console.log(
        "First post Sheet Date:",
        getSheetDate(allPosts[0])
      );

    }


    createFilters();

    displayPosts();


  } catch (error) {

    console.error(error);


    status.textContent =
      "Unable to load Instagram posts.";


    postsContainer.innerHTML = `

      <div class="message">

        ❌ Unable to load posts.

        <br><br>

        Please check the Cloudflare Worker
        and Google Sheet.

      </div>

    `;

  }

}



/*
=====================================================
CREATE CATEGORY FILTERS
=====================================================
*/

function createFilters() {

  const filtersContainer =
    document.getElementById("filters");


  filtersContainer.innerHTML = "";


  const categories = [

    "All",

    ...new Set(

      allPosts
        .map(
          post => post.category
        )
        .filter(
          category => category
        )

    )

  ];


  categories.forEach(
    category => {

      const button =
        document.createElement(
          "button"
        );


      button.className =
        "filter-btn";


      if (
        category ===
        activeCategory
      ) {

        button.classList.add(
          "active"
        );

      }


      button.textContent =
        category;


      button.onclick =
        function () {

          activeCategory =
            category;

          createFilters();

          displayPosts();

        };


      filtersContainer
        .appendChild(button);

    }
  );

}



/*
=====================================================
NORMALIZE INSTAGRAM URL
=====================================================
*/

function normalizeInstagramUrl(url) {

  if (!url) {
    return null;
  }


  try {

    const parsed =
      new URL(
        String(url).trim()
      );


    const hostname =
      parsed.hostname.toLowerCase();


    if (
      hostname !== "www.instagram.com" &&
      hostname !== "instagram.com"
    ) {

      return null;

    }


    const parts =
      parsed.pathname
        .split("/")
        .filter(Boolean);


    if (
      parts.length < 2
    ) {

      return null;

    }


    const type =
      parts[0];


    const id =
      parts[1];


    if (
      type !== "p" &&
      type !== "reel" &&
      type !== "tv"
    ) {

      return null;

    }


    return (
      `https://www.instagram.com/` +
      `${type}/${id}/`
    );


  } catch {

    return null;

  }

}



/*
=====================================================
DISPLAY DATE

ONLY SHEET/CSV DATE IS DISPLAYED.
=====================================================
*/

function formatPostTimestamp(post) {

  const sheetDate =
    getSheetDate(post);


  if (!sheetDate) {

    return "Date unavailable";

  }


  return sheetDate;

}



/*
=====================================================
PARSE SHEET DATE
=====================================================
*/

function parsePostDate(post) {

  /*
    IMPORTANT:

    The only source is the Sheet/CSV
    Date value.
  */

  const value =
    getSheetDate(post);


  if (!value) {

    return null;

  }


  /*
  -----------------------------------------------
  YYYY-MM-DD

  Example:
  2026-10-07
  -----------------------------------------------
  */

  let match =
    value.match(
      /^(\d{4})[-\/](\d{1,2})[-\/](\d{1,2})/
    );


  if (match) {

    return makeValidDate(

      Number(match[1]),

      Number(match[2]),

      Number(match[3])

    );

  }



  /*
  -----------------------------------------------
  DD/MM/YYYY

  DD-MM-YYYY

  Example:
  07/10/2026
  -----------------------------------------------
  */

  match =
    value.match(
      /^(\d{1,2})[-\/](\d{1,2})[-\/](\d{2,4})/
    );


  if (match) {

    let year =
      Number(match[3]);


    if (year < 100) {

      year += 2000;

    }


    return makeValidDate(

      year,

      Number(match[2]),

      Number(match[1])

    );

  }



  /*
  -----------------------------------------------
  DD Mon YYYY

  Example:
  07 Oct 2026
  -----------------------------------------------
  */

  match =
    value.match(
      /^(\d{1,2})\s+([A-Za-z]+)\s+(\d{2,4})/
    );


  if (match) {

    let year =
      Number(match[3]);


    if (year < 100) {

      year += 2000;

    }


    const monthNames = [
      "jan",
      "feb",
      "mar",
      "apr",
      "may",
      "jun",
      "jul",
      "aug",
      "sep",
      "oct",
      "nov",
      "dec"
    ];


    const monthText =
      match[2].toLowerCase();


    const monthIndex =
      monthNames.findIndex(
        month =>
          monthText.startsWith(month)
      );


    if (
      monthIndex !== -1
    ) {

      return makeValidDate(

        year,

        monthIndex + 1,

        Number(match[1])

      );

    }

  }



  /*
  -----------------------------------------------
  Google Sheet full date/time

  Still uses ONLY the Sheet value.
  -----------------------------------------------
  */

  const fallback =
    new Date(value);


  if (
    !isNaN(
      fallback.getTime()
    )
  ) {

    return new Date(

      fallback.getFullYear(),

      fallback.getMonth(),

      fallback.getDate()

    );

  }


  console.warn(
    "Could not parse Sheet date:",
    value
  );


  return null;

}



/*
=====================================================
VALIDATE DATE
=====================================================
*/

function makeValidDate(
  year,
  month,
  day
) {

  const date =
    new Date(
      year,
      month - 1,
      day
    );


  if (
    date.getFullYear() !== year ||
    date.getMonth() !== month - 1 ||
    date.getDate() !== day
  ) {

    return null;

  }


  return date;

}



/*
=====================================================
APPLY DATE FILTER
=====================================================
*/

function applyDateFilter() {

  const fromInput =
    document.getElementById(
      "fromDate"
    ).value;


  const toInput =
    document.getElementById(
      "toDate"
    ).value;


  if (
    fromInput &&
    toInput &&
    fromInput > toInput
  ) {

    alert(
      "From date cannot be later than To date."
    );

    return;

  }


  activeFromDate =
    fromInput;


  activeToDate =
    toInput;


  displayPosts();

}



/*
=====================================================
CLEAR DATE FILTER
=====================================================
*/

function clearDateFilter() {

  document.getElementById(
    "fromDate"
  ).value = "";


  document.getElementById(
    "toDate"
  ).value = "";


  activeFromDate = "";

  activeToDate = "";


  displayPosts();

}



/*
=====================================================
DATE MATCHING
=====================================================
*/

function matchesDateFilter(post) {

  /*
    No filter selected:
    show everything.
  */

  if (
    !activeFromDate &&
    !activeToDate
  ) {

    return true;

  }


  /*
    Get ONLY Sheet date.
  */

  const postDate =
    parsePostDate(post);


  if (!postDate) {

    return false;

  }


  const year =
    postDate.getFullYear();


  const month =
    String(
      postDate.getMonth() + 1
    ).padStart(2, "0");


  const day =
    String(
      postDate.getDate()
    ).padStart(2, "0");


  const postDateString =
    `${year}-${month}-${day}`;


  /*
    FROM
  */

  if (
    activeFromDate &&
    postDateString < activeFromDate
  ) {

    return false;

  }


  /*
    TO
  */

  if (
    activeToDate &&
    postDateString > activeToDate
  ) {

    return false;

  }


  return true;

}



/*
=====================================================
DISPLAY POSTS
=====================================================
*/

function displayPosts() {

  const postsContainer =
    document.getElementById(
      "posts"
    );


  const status =
    document.getElementById(
      "status"
    );


  postsContainer.innerHTML =
    "";


  const filteredPosts =
    allPosts.filter(
      post => {

        const categoryMatches =
          activeCategory === "All" ||
          post.category === activeCategory;


        const dateMatches =
          matchesDateFilter(post);


        return (
          categoryMatches &&
          dateMatches
        );

      }
    );


  /*
    No matching posts
  */

  if (
    filteredPosts.length === 0
  ) {

    status.textContent =
      "No matching Instagram posts";


    postsContainer.innerHTML = `

      <div class="message">

        No Instagram posts found.

        <br><br>

        <small>
          The filter uses only the Date
          column from your Sheet/CSV.
        </small>

      </div>

    `;


    return;

  }



  /*
    Status
  */

  let filterDescription = "";


  if (
    activeFromDate ||
    activeToDate
  ) {

    const fromText =
      activeFromDate
        ? formatFilterDate(activeFromDate)
        : "Beginning";


    const toText =
      activeToDate
        ? formatFilterDate(activeToDate)
        : "End";


    filterDescription =
      ` | ${fromText} → ${toText}`;

  }


  status.textContent =
    `${filteredPosts.length} Instagram post` +
    `${filteredPosts.length === 1 ? "" : "s"}` +
    filterDescription;



  /*
    Create cards
  */

  filteredPosts.forEach(
    post => {

      const instagramUrl =
        normalizeInstagramUrl(
          post.url
        );


      if (!instagramUrl) {

        return;

      }


      const card =
        document.createElement(
          "article"
        );


      card.className =
        "post-card";


      card.innerHTML = `

        <div class="post-meta">

          <div class="post-timestamp">

            🕒 Posted:
            ${escapeHtml(
              formatPostTimestamp(post)
            )}

          </div>


          <div class="post-top-row">

            <span class="category">

              ${escapeHtml(
                post.category || "Other"
              )}

            </span>


            <span class="media">

              ${escapeHtml(
                post.media || "Photo"
              )}

            </span>

          </div>

        </div>


        <div class="instagram-container">

          <blockquote

            class="instagram-media"

            data-instgrm-permalink="${instagramUrl}"

            data-instgrm-version="14"

            style="
              background:#FFF;
              border:0;
              border-radius:3px;
              box-shadow:
                0 0 1px 0
                rgba(0,0,0,0.5),
                0 1px 10px 0
                rgba(0,0,0,0.15);
              margin:1px;
              max-width:540px;
              min-width:326px;
              padding:0;
              width:calc(100% - 2px);
            "
          >

            <div style="padding:16px;">

              <a
                href="${instagramUrl}"
                target="_blank"
                rel="noopener noreferrer"
                style="
                  text-decoration:none;
                  color:#333;
                "
              >

                View this post
                on Instagram

              </a>

            </div>

          </blockquote>

        </div>

      `;


      postsContainer.appendChild(card);

    }
  );


  processInstagramEmbeds();

}



/*
=====================================================
FORMAT FILTER DATE
=====================================================
*/

function formatFilterDate(value) {

  const parts =
    value.split("-");


  if (
    parts.length !== 3
  ) {

    return value;

  }


  const date =
    new Date(
      Number(parts[0]),
      Number(parts[1]) - 1,
      Number(parts[2])
    );


  return date.toLocaleDateString(
    "en-IN",
    {
      day: "2-digit",
      month: "short",
      year: "numeric"
    }
  );

}



/*
=====================================================
INSTAGRAM EMBEDS
=====================================================
*/

function processInstagramEmbeds() {

  if (
    window.instgrm &&
    window.instgrm.Embeds
  ) {

    window.instgrm
      .Embeds
      .process();

  } else {

    setTimeout(
      processInstagramEmbeds,
      500
    );

  }

}



/*
=====================================================
HTML ESCAPE
=====================================================
*/

function escapeHtml(value) {

  return String(value)

    .replace(
      /&/g,
      "&amp;"
    )

    .replace(
      /</g,
      "&lt;"
    )

    .replace(
      />/g,
      "&gt;"
    )

    .replace(
      /"/g,
      "&quot;"
    )

    .replace(
      /'/g,
      "&#039;"
    );

}



/*
=====================================================
DATE INPUT LIMITS
=====================================================
*/

document
  .getElementById("fromDate")
  .addEventListener(
    "change",
    function () {

      const toDate =
        document.getElementById(
          "toDate"
        );


      if (this.value) {

        toDate.min =
          this.value;

      } else {

        toDate.removeAttribute(
          "min"
        );

      }

    }
  );


document
  .getElementById("toDate")
  .addEventListener(
    "change",
    function () {

      const fromDate =
        document.getElementById(
          "fromDate"
        );


      if (this.value) {

        fromDate.max =
          this.value;

      } else {

        fromDate.removeAttribute(
          "max"
        );

      }

    }
  );



/*
=====================================================
START
=====================================================
*/

loadPosts();

</script>

</body>

</html>
