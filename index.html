<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <base target="_top">
  <title>Instagram Posts </title>
  <link href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: 'Google Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background-color: #f8f9fa;
      color: #202124;
      padding: 24px;
    }
    .container {
      max-width: 1280px;
      margin: 0 auto;
    }
    .header {
      margin-bottom: 24px;
    }
    .header h1 {
      font-size: 26px;
      font-weight: 700;
      color: #1a73e8;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .header p {
      font-size: 14px;
      color: #5f6368;
      margin-top: 4px;
    }

    /* Filter Controls Card */
    .filter-card {
      background: #ffffff;
      border-radius: 12px;
      padding: 20px;
      box-shadow: 0 1px 3px rgba(60,64,67,0.12), 0 1px 2px rgba(60,64,67,0.24);
      margin-bottom: 24px;
    }
    .filters-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 16px;
      align-items: flex-end;
    }
    .filter-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .filter-group label {
      font-size: 12px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: #5f6368;
    }
    .filter-group select, .filter-group input {
      padding: 10px 14px;
      border-radius: 8px;
      border: 1px solid #dadce0;
      font-size: 14px;
      font-family: inherit;
      background-color: #ffffff;
      outline: none;
      transition: all 0.2s ease;
    }
    .filter-group select:focus, .filter-group input:focus {
      border-color: #1a73e8;
      box-shadow: 0 0 0 2px rgba(26,115,232,0.2);
    }
    .btn-reset {
      padding: 10px 16px;
      border-radius: 8px;
      border: 1px solid #dadce0;
      background: #ffffff;
      color: #3c4043;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      transition: background 0.2s;
    }
    .btn-reset:hover {
      background: #f1f3f4;
    }

    .status-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 14px;
      padding-top: 14px;
      border-top: 1px solid #f1f3f4;
      font-size: 13px;
      color: #5f6368;
    }

    /* Cards Layout */
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(360px, 1fr));
      gap: 24px;
    }
    .card {
      background: #ffffff;
      border-radius: 12px;
      border: 1px solid #e0e2e6;
      box-shadow: 0 1px 2px rgba(60,64,67,0.1);
      padding: 18px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      transition: transform 0.2s, box-shadow 0.2s;
    }
    .card:hover {
      box-shadow: 0 4px 12px rgba(60,64,67,0.15);
      transform: translateY(-2px);
    }
    .meta-row {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      align-items: center;
      margin-bottom: 14px;
    }
    .chip {
      font-size: 11px;
      font-weight: 600;
      padding: 4px 10px;
      border-radius: 20px;
      text-transform: capitalize;
    }
    .chip-category { background: #e8f0fe; color: #174ea6; }
    .chip-subcategory { background: #fef7e0; color: #b06000; }
    .chip-media { background: #e6f4ea; color: #137333; }
    .chip-date { background: #f1f3f4; color: #3c4043; margin-left: auto; font-weight: 500; }

    .embed-wrapper {
      min-height: 420px;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #fafafa;
      border-radius: 8px;
      overflow: hidden;
    }

    .card-footer {
      margin-top: 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .direct-link {
      font-size: 13px;
      color: #1a73e8;
      text-decoration: none;
      font-weight: 500;
    }
    .direct-link:hover {
      text-decoration: underline;
    }
    .row-indicator {
      font-size: 12px;
      color: #80868b;
    }

    /* Loading & Empty State */
    .state-box {
      text-align: center;
      padding: 60px 20px;
      background: #ffffff;
      border-radius: 12px;
      border: 1px dashed #dadce0;
      color: #5f6368;
      font-size: 15px;
    }
    .spinner {
      border: 3px solid #f3f3f3;
      border-top: 3px solid #1a73e8;
      border-radius: 50%;
      width: 28px;
      height: 28px;
      animation: spin 1s linear infinite;
      margin: 0 auto 12px auto;
    }
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
  </style>
  <!-- Instagram Official Embed SDK -->
  <script async src="//www.instagram.com/embed.js"></script>
</head>
<body>

  <div class="container">
    <!-- Header -->
    <div class="header">
      <h1>📷 Instagram Tracker & Preview</h1>
      <p>Live synced data and visual feeds from Sheet1</p>
    </div>

    <!-- Filters -->
    <div class="filter-card">
      <div class="filters-grid">
        <div class="filter-group">
          <label for="filter-cat">Category</label>
          <select id="filter-cat" onchange="applyFilters()">
            <option value="ALL">All Categories</option>
          </select>
        </div>

        <div class="filter-group">
          <label for="filter-subcat">Subcategory</label>
          <select id="filter-subcat" onchange="applyFilters()">
            <option value="ALL">All Subcategories</option>
          </select>
        </div>

        <div class="filter-group">
          <label for="filter-media">Media Type</label>
          <select id="filter-media" onchange="applyFilters()">
            <option value="ALL">All Media</option>
          </select>
        </div>

        <div class="filter-group">
          <label for="filter-date">Posted Date</label>
          <input type="date" id="filter-date" onchange="applyFilters()">
        </div>

        <button class="btn-reset" onclick="resetFilters()">Reset Filters</button>
      </div>

      <div class="status-bar">
        <span id="post-count">Loading data from Google Sheet...</span>
        <span id="sheet-sync-status">Connected to Sheet1</span>
      </div>
    </div>

    <!-- Loading State -->
    <div id="loading" class="state-box">
      <div class="spinner"></div>
      Loading your Instagram posts...
    </div>

    <!-- Cards Grid -->
    <div class="grid" id="posts-grid" style="display: none;"></div>
  </div>

  <script>
    let allPosts = [];

    // Fetch data from Apps Script on page load
    window.addEventListener('DOMContentLoaded', () => {
      google.script.run
        .withSuccessHandler(onDataLoaded)
        .withFailureHandler(onError)
        .getSheetData();
    });

    function onError(err) {
      document.getElementById('loading').innerHTML = `
        <span style="color: #d93025; font-weight: 500;">Failed to load data from Sheet:</span> ${err}
      `;
    }

    function onDataLoaded(data) {
      allPosts = data;
      document.getElementById('loading').style.display = 'none';
      document.getElementById('posts-grid').style.display = 'grid';

      buildDropdowns();
      applyFilters();
    }

    function buildDropdowns() {
      const categories = [...new Set(allPosts.map(p => p.category).filter(Boolean))].sort();
      const subcategories = [...new Set(allPosts.map(p => p.subcategory).filter(Boolean))].sort();
      const mediaTypes = [...new Set(allPosts.map(p => p.media).filter(Boolean))].sort();

      const catSelect = document.getElementById('filter-cat');
      categories.forEach(c => catSelect.innerHTML += `<option value="${c}">${c}</option>`);

      const subcatSelect = document.getElementById('filter-subcat');
      subcategories.forEach(s => subcatSelect.innerHTML += `<option value="${s}">${s}</option>`);

      const mediaSelect = document.getElementById('filter-media');
      mediaTypes.forEach(m => mediaSelect.innerHTML += `<option value="${m}">${m}</option>`);
    }

    function resetFilters() {
      document.getElementById('filter-cat').value = 'ALL';
      document.getElementById('filter-subcat').value = 'ALL';
      document.getElementById('filter-media').value = 'ALL';
      document.getElementById('filter-date').value = '';
      applyFilters();
    }

    function applyFilters() {
      const selectedCat = document.getElementById('filter-cat').value;
      const selectedSubcat = document.getElementById('filter-subcat').value;
      const selectedMedia = document.getElementById('filter-media').value;
      const selectedDate = document.getElementById('filter-date').value;

      const filtered = allPosts.filter(p => {
        const matchCat = (selectedCat === 'ALL' || p.category === selectedCat);
        const matchSubcat = (selectedSubcat === 'ALL' || p.subcategory === selectedSubcat);
        const matchMedia = (selectedMedia === 'ALL' || p.media === selectedMedia);
        const matchDate = (!selectedDate || p.postedDate === selectedDate);
        return matchCat && matchSubcat && matchMedia && matchDate;
      });

      document.getElementById('post-count').innerText = `Showing ${filtered.length} of ${allPosts.length} posts`;

      const grid = document.getElementById('posts-grid');
      grid.innerHTML = '';

      if (filtered.length === 0) {
        grid.innerHTML = `
          <div class="state-box" style="grid-column: 1/-1;">
            No Instagram posts match your current filter criteria.
          </div>
        `;
        return;
      }

      filtered.forEach(post => {
        const card = document.createElement('div');
        card.className = 'card';

        // Extract base permalink without query parameters for clean Instagram embedding
        const cleanUrl = post.url.split('?')[0];

        card.innerHTML = `
          <div>
            <div class="meta-row">
              <span class="chip chip-category">${post.category}</span>
              ${post.subcategory && post.subcategory !== 'None' ? `<span class="chip chip-subcategory">${post.subcategory}</span>` : ''}
              <span class="chip chip-media">${post.media}</span>
              <span class="chip chip-date">${post.postedDate || 'No Date'}</span>
            </div>
            <div class="embed-wrapper">
              <blockquote 
                class="instagram-media" 
                data-instgrm-permalink="${cleanUrl}" 
                data-instgrm-version="14" 
                style="width: 100%; margin: 0; padding: 0;">
              </blockquote>
            </div>
          </div>
          <div class="card-footer">
            <span class="row-indicator">Row #${post.rowIndex}</span>
            <a class="direct-link" href="${post.url}" target="_blank" rel="noopener noreferrer">Open on Instagram ↗</a>
          </div>
        `;
        grid.appendChild(card);
      });

      // Trigger Instagram's embed parser for the newly created elements
      if (window.instgrm && window.instgrm.Embeds) {
        window.instgrm.Embeds.process();
      }
    }
  </script>
</body>
</html>
